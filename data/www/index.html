<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0f13">
  <title>jRadio — плеер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='45%25' r='55%25'%3E%3Cstop offset='0%25' stop-color='%237bffb0'/%3E%3Cstop offset='55%25' stop-color='%2322e06a'/%3E%3Cstop offset='100%25' stop-color='%230a8f3c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%23121417'/%3E%3Ccircle cx='16' cy='16' r='11' fill='url(%23g)'/%3E%3Cpath d='M16 16 12.9 5.6a11 11 0 0 1 6.2 0Z' fill='%23103a22'/%3E%3Ccircle cx='16' cy='16' r='3.7' fill='%230d1a12'/%3E%3Ccircle cx='16' cy='16' r='12.3' fill='none' stroke='%238c96a3' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body class="player-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="jradio — главная">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <defs>
              <radialGradient id="eye-glow" cx="50%" cy="45%" r="55%">
                <stop offset="0%" stop-color="#7bffb0"/>
                <stop offset="55%" stop-color="#22e06a"/>
                <stop offset="100%" stop-color="#0a8f3c"/>
              </radialGradient>
            </defs>
            <circle class="eye-face" cx="16" cy="16" r="12" fill="url(#eye-glow)"/>
            <path class="eye-wedge" d="M16 16 12.6 4.6a12 12 0 0 1 6.8 0Z"/>
            <circle class="eye-pupil" cx="16" cy="16" r="4"/>
            <circle class="eye-ring" cx="16" cy="16" r="13.4"/>
            <path class="eye-ticks" d="M16 1.6v2.2M30.4 16h-2.2M1.6 16h2.2"/>
          </svg>
        </span>
        <span class="brand-word">jRadio</span>
      </a>

      <nav id="source-tabs" class="source-tabs" aria-label="Источники"></nav>

      <div class="header-actions">
        <span id="socket-state" class="socket-state is-connecting" role="status" aria-live="polite">
          Подключение…
        </span>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button"
                aria-label="Сменить тему">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>
          </svg>
        </button>
        <a id="playlist-link" class="icon-button" href="/playlist" aria-label="Редактор плейлиста" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6h11M4 12h11M4 18h7M17 15v6m-3-3h6"/>
          </svg>
        </a>
        <a class="icon-button settings-link" href="/settings" aria-label="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.9 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <section id="player-bar" class="player-bar" aria-labelledby="mode-label">
      <div class="player-main">
        <!-- The source is already named by the active tab; it stays here only
             as the region's label for a screen reader. -->
        <p id="mode-label" class="sr-only">Нет источника</p>

        <!-- The tile only wraps the picture: it clips the rounded corner and
             it is what the phone rules resize. With nothing in it the tile is
             not drawn at all. -->
        <div class="track-art" aria-hidden="true">
          <img id="track-cover" class="track-cover" alt="" hidden>
        </div>

        <div class="player-body">
          <div class="track-copy">
            <div class="track-lines">
              <h1 id="track-title">Нет воспроизведения</h1>
              <p id="track-artist" class="track-artist"></p>
              <p id="track-context" class="track-context"></p>
            </div>

            <div class="stream-details">
              <p id="playback-state" class="state-chip" data-state="stopped">Остановлено</p>
              <p id="stream-meta" class="stream-chip">Ожидание связи</p>
            </div>
          </div>

          <div class="player-transport">
            <div class="player-controls">
              <button id="previous-item" class="step-item" type="button" data-command="player.previous_item"
                      hidden aria-label="Предыдущий трек">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="m17 7-7 5 7 5ZM8 7H6v10h2z"/>
                </svg>
              </button>
              <button id="like-track" class="like-track" type="button" data-command="player.like"
                      hidden aria-label="Нравится" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 20.3 4.6 12.9a4.6 4.6 0 1 1 6.5-6.5l.9.9.9-.9a4.6 4.6 0 1 1 6.5 6.5Z"/>
                </svg>
              </button>
              <button id="play-toggle" class="play-toggle" type="button" data-command="player.toggle"
                      disabled aria-label="Воспроизвести">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="m9 7 8 5-8 5Z"/>
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M8 7h3v10H8zM13 7h3v10h-3z"/>
                </svg>
              </button>
              <button id="dislike-track" class="dislike-track" type="button" data-command="player.dislike"
                      hidden aria-label="Не нравится" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 20.3 4.6 12.9a4.6 4.6 0 1 1 6.5-6.5l.9.9.9-.9a4.6 4.6 0 1 1 6.5 6.5Z"/>
                  <!-- Two copies of one line: the wide one is painted in the
                       bar's own background and knocks a gap out of the heart, the
                       thin one is the slash itself. Without the gap the two
                       outlines merge into a smudge. -->
                  <path class="slash-gap" d="M4.5 4.5 19.5 19.5"/>
                  <path class="slash" d="M4.5 4.5 19.5 19.5"/>
                </svg>
              </button>
              <button id="next-track" class="next-track" type="button" data-command="player.next"
                      hidden aria-label="Следующий трек">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="m7 7 7 5-7 5Zm9 0h2v10h-2z"/>
                </svg>
              </button>
              <button id="next-item" class="step-item" type="button" data-command="player.next_item"
                      hidden aria-label="Следующий трек">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="m7 7 7 5-7 5Zm9 0h2v10h-2z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="player-bottom">
            <div id="track-progress" class="track-progress" hidden>
              <span id="track-elapsed" class="track-time">0:00</span>
              <div id="progress-rail" class="progress-rail">
                <div id="progress-fill" class="progress-fill"></div>
                <input id="progress-seek" class="progress-seek" type="range"
                       min="0" max="0" step="1" value="0"
                       aria-label="Позиция в треке" disabled>
              </div>
              <span id="track-total" class="track-time">0:00</span>
            </div>
            <div id="volume-control" class="volume-control" hidden>
              <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4zM16 9.2a3.8 3.8 0 0 1 0 5.6M18.6 6.6a7.4 7.4 0 0 1 0 10.8"/>
              </svg>
              <input id="volume-input" type="range" min="0" max="100" step="1" value="0"
                     aria-label="Громкость" disabled>
              <output id="volume-value">0</output>
            </div>
          </div>
        </div>

        <!-- Phone only: on a large screen the panel shows everything already. -->
        <button id="player-expand" class="player-expand" type="button"
                aria-label="Развернуть карточку трека" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m6 15 6-6 6 6"/>
          </svg>
        </button>
      </div>

      <p id="player-error" class="player-error" role="alert" hidden></p>
      <p id="command-status" class="command-status" role="status" aria-live="polite"></p>
    </section>

    <section id="media-list" class="media-list" aria-labelledby="list-title" hidden>
      <div class="list-head">
        <h2 id="list-title">Станции</h2>
        <span id="list-count" class="list-count" aria-label="Количество элементов">0</span>
        <input id="list-search" class="list-search" type="search" autocomplete="off"
               placeholder="Поиск по списку" aria-label="Поиск по списку">
      </div>
      <ul id="list-items" class="list-items" aria-label="Список станций"></ul>
      <p id="list-empty" class="empty-state">Список пока пуст</p>
      <p id="list-loading" class="list-loading" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>Загружаем станции…
      </p>
    </section>
  </div>

  <noscript>
    <p class="noscript-message">Для управления плеером в браузере требуется JavaScript.</p>
  </noscript>
  <script src="/app.js"></script>
</body>
</html>
