<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0f13">
  <title>jRadio — пульт</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='45%25' r='55%25'%3E%3Cstop offset='0%25' stop-color='%237bffb0'/%3E%3Cstop offset='55%25' stop-color='%2322e06a'/%3E%3Cstop offset='100%25' stop-color='%230a8f3c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%23121417'/%3E%3Ccircle cx='16' cy='16' r='11' fill='url(%23g)'/%3E%3Cpath d='M16 16 12.9 5.6a11 11 0 0 1 6.2 0Z' fill='%23103a22'/%3E%3Ccircle cx='16' cy='16' r='3.7' fill='%230d1a12'/%3E%3Ccircle cx='16' cy='16' r='12.3' fill='none' stroke='%238c96a3' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script src="/i18n.js"></script>
</head>
<body data-i18n-page="title.remote">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-i18n-aria="nav.back_to_player" aria-label="Вернуться к плееру">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <defs>
              <radialGradient id="eye-glow" cx="50%" cy="45%" r="55%">
                <stop offset="0%" stop-color="#7bffb0"/>
                <stop offset="55%" stop-color="#22e06a"/>
                <stop offset="100%" stop-color="#0a8f3c"/>
              </radialGradient>
            </defs>
            <circle class="eye-face" cx="16" cy="16" r="12" fill="url(#eye-glow)"/>
            <path class="eye-wedge" d="M16 16 12.6 4.6a12 12 0 0 1 6.8 0Z"/>
            <circle class="eye-pupil" cx="16" cy="16" r="4"/>
            <circle class="eye-ring" cx="16" cy="16" r="13.4"/>
            <path class="eye-ticks" d="M16 1.6v2.2M30.4 16h-2.2M1.6 16h2.2"/>
          </svg>
        </span>
        <span class="brand-word">jRadio</span>
      </a>

      <nav class="source-tabs" data-i18n-aria="nav.sections" aria-label="Разделы">
        <a class="source-tab" href="/" data-i18n="nav.player">Плеер</a>
        <a class="source-tab" href="/playlist" data-i18n="nav.playlist">Плейлист</a>
        <a class="source-tab" href="/settings" data-i18n="nav.settings">Настройки</a>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle" class="icon-button theme-toggle" type="button"
                data-i18n-aria="theme.toggle" aria-label="Сменить тему">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="page-heading">
      <h1 data-i18n="remote.title">Пульт</h1>
      <p data-i18n="note.remote_page">Любой инфракрасный пульт: нажмите «Обучить» у функции, затем кнопку на пульте. Одна кнопка — одна функция; таблица хранится на устройстве в remote.csv.</p>
    </div>

    <section class="card" aria-labelledby="remote-title">
      <div class="card-head">
        <h2 id="remote-title" data-i18n="remote.keys">Кнопки</h2>
        <span id="remote-status" class="settings-status" role="status" aria-live="polite"></span>
      </div>
      <div class="card-body">
        <p id="remote-missing" class="field-note is-error" data-i18n="remote.missing" hidden>В этой сборке нет ИК-приёмника: IR_RECEIVER_GPIO не задан.</p>
        <div id="remote-groups"></div>
      </div>
    </section>
  </main>

  <noscript><p class="noscript-message">Для обучения пульта требуется JavaScript. / JavaScript is required to teach the remote.</p></noscript>
  <script src="/remote.js"></script>
</body>
</html>
